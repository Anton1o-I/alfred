[project]
name = "alfred"
version = "0.1.0"
description = "Multi-agent home assistant for family productivity"
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.28,<1",
    "click>=8.1,<9",
    "structlog>=24.0",
    "aiosqlite>=0.21",
    # Agent framework
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic-ai>=0.2",
    # Observability
    "arize-phoenix-otel>=0.8",
    "openinference-instrumentation-langchain>=0.1",
    "openinference-instrumentation-openai>=0.1",
    # LLM gateway client
    "openai>=1.60",
    # Google Calendar
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # Scheduling
    "apscheduler>=3.10",
    # Research curator (RSS + arXiv ingestion)
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
alfred = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred", "cli"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
