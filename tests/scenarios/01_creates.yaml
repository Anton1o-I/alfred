# ── Relative-date stress tests ─────────────────────────────────────────────
# These are deliberately tricky phrasings. Qwen 3 handles most relative
# dates well but occasionally trips on negation ("not tomorrow, the next
# one") — that's a known limitation we accept rather than a regression
# signal. The "explicit" sister scenarios verify the common-case path.

- name: relative_next_one_exclusion
  # KNOWN-FLAKY stress test. The phrase "Monday, not tomorrow, the next one"
  # is hard for the model: it has to identify the next Monday after today
  # (May 18), then go ONE MORE Monday (May 25). Qwen 3 sometimes picks
  # tomorrow's Monday. Real-world impact is low — users would just see
  # the wrong date in the reply and correct it.
  email: |
    Book lunch with Emily Monday, not tomorrow, the next one, 12pm
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    event_summary_contains: ["Emily"]
    event_start_iso: "2026-05-25T12:00:00-05:00"
    calendar_count_after: 1

- name: relative_explicit_unambiguous
  # The well-phrased version of the above. Should always pass.
  email: |
    Book lunch with Emily on May 25 at 12pm
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    event_summary_contains: ["Emily"]
    event_start_iso: "2026-05-25T12:00:00-05:00"
    calendar_count_after: 1

