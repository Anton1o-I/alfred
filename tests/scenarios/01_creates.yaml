# Create-event scenarios across phrasing styles and detail levels.
# "today" is always pinned (Sunday 2026-05-17) so relative dates resolve
# deterministically.
#
# Note: scenarios that aren't specifically testing relative-date parsing
# use explicit "Month Day" forms — Qwen's relative-date reasoning is shaky
# enough that those scenarios should focus on what they actually test
# (titles, locations, recurrence, etc.) rather than re-testing date math.

# ── Specific & explicit ────────────────────────────────────────────────────

- name: explicit_date_time_person
  email: |
    Schedule lunch with Sarah on May 20 at 12:30pm
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    event_summary_contains: ["Sarah"]
    event_summary_excludes: ["Schedule", "Add"]
    event_start_iso: "2026-05-20T12:30:00-05:00"
    calendar_count_after: 1
    has_recurrence: false

- name: explicit_calendar_date_with_duration
  email: |
    Add a doctor appointment May 19 at 2:30pm for 45 minutes
  today: "2026-05-17"
  initial_calendar: []
