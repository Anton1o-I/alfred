# Tasks-agent scenarios — 7 categories × 5 cases each (35 total).
# Real LLM, in-memory SQLite DB. Today is pinned per scenario.
#
# Categories: create-recurring, create-once, dedup, complete, list, delete, update.

# ─────────────────────────────────────────────────────────────────────────
# CREATE — recurring chores (schedule + completion based)
# ─────────────────────────────────────────────────────────────────────────

- name: create_weekly_tuesday
  kind: tasks
  email: |
    Add chore: take out the trash every Tuesday, household.
  today: "2026-05-17"
  initial_chores: []
  expect:
    outcome: created
    active_count_after: 1
    # Title normalizer should strip the article: "Take out the trash" → "Take out trash".
    reply_contains: ["Take out trash"]
    reply_excludes: ["Take out the trash"]

- name: create_daily_simple
  kind: tasks
  email: |
    New chore: water the plants every day, primary owns it.
  today: "2026-05-17"
