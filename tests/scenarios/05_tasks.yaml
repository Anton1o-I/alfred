- name: create_every_n_days_interval
  kind: tasks
  email: |
    Add a task to pick up dog poop every 2 days. Assign to Alex.
  today: "2026-05-17"
  initial_chores: []
  # Two regressions guarded here:
  #   1. "every 2 days" must yield interval=2 (not 1) — surfaces as "every 2"
  #      in the rendered reply.
  #   2. "Assign to Alex" must resolve to user_id=primary via the name map.
  expect:
    outcome: created
    active_count_after: 1
    reply_contains: ["primary", "every 2"]
    reply_excludes: ["secondary", "household"]

