# ─────────────────────────────────────────────────────────────────────────
# DEDUP — duplicate detection, including bathroom distinction
# ─────────────────────────────────────────────────────────────────────────

- name: dedup_slam_dunk_paraphrase
  kind: tasks
  email: |
    New chore: take the trash out every week on Tuesday.
  today: "2026-05-17"
  initial_chores:
    - id: take-out-trash
      title: "Take out trash"
      assignee: household
      recurrence_type: schedule
      recurrence_rule: { frequency: WEEKLY, interval: 1, byday: [TU] }
      object: trash
      qualifier: null
  expect:
    outcome: duplicate_existing
    active_count_after: 1
    reply_contains: ["same chore"]

- name: dedup_main_vs_hallway_bathroom_distinct
  kind: tasks
  email: |
    Add chore: clean the hallway bathroom every Saturday, household.
  today: "2026-05-17"
  initial_chores:
    - id: clean-main-bathroom
      title: "Clean main bathroom"
      assignee: household
      recurrence_type: schedule
      recurrence_rule: { frequency: WEEKLY, interval: 1, byday: [SA] }
      object: bathroom
      qualifier: main
  # Same object (bathroom) + different qualifiers (main vs hallway) →
  # the code-side comparison must return 'none'.
  expect:
    outcome: created
    active_count_after: 2

- name: dedup_master_vs_kids_bathroom_distinct
  kind: tasks
  email: |
    New chore: scrub the kids' bathroom every Sunday, secondary.
  today: "2026-05-17"
  initial_chores:
    - id: clean-master-bathroom
      title: "Clean master bathroom"
      assignee: primary
      recurrence_type: schedule
      recurrence_rule: { frequency: WEEKLY, interval: 1, byday: [SU] }
      object: bathroom
      qualifier: master
  expect:
    outcome: created
    active_count_after: 2

- name: dedup_same_bathroom_different_wording
  kind: tasks
  email: |
    Add: wipe down the main bathroom every Saturday, household.
  today: "2026-05-17"
  initial_chores:
    - id: clean-main-bathroom
      title: "Clean main bathroom"
      assignee: household
      recurrence_type: schedule
      recurrence_rule: { frequency: WEEKLY, interval: 1, byday: [SA] }
      object: bathroom
      qualifier: main
  # Same object + same qualifier — code returns 'high'.
  expect:
    active_count_after: 1
    reply_contains: ["same chore"]

- name: dedup_kitchen_vs_kitchen_counters_distinct
  kind: tasks
  email: |
    Add chore: wipe down the kitchen counters every evening, household.
  today: "2026-05-17"
  initial_chores:
    - id: deep-clean-kitchen
      title: "Deep clean kitchen"
      assignee: household
      recurrence_type: schedule
      recurrence_rule: { frequency: WEEKLY, interval: 1, byday: [SA] }
      object: kitchen
      qualifier: null
  # Different objects (kitchen vs counters) → code returns 'none'.
  expect:
    outcome: created
    active_count_after: 2

- name: dedup_qualified_vs_unqualified_same_object_medium
  kind: tasks
  email: |
    Add: clean the main bathroom every Saturday, household.
  today: "2026-05-17"
  initial_chores:
    - id: clean-bathroom
      title: "Clean bathroom"
      assignee: household
      recurrence_type: schedule
      recurrence_rule: { frequency: WEEKLY, interval: 1, byday: [SA] }
      object: bathroom
      qualifier: null
  # Same object, one qualified ('main'), one not → code returns 'medium',
  # workflow renders the "needs confirmation" reply, no new chore written.
  expect:
    outcome: duplicate_needs_confirmation
    active_count_after: 1
    reply_contains: ["might be the same"]

- name: dedup_legacy_no_shape_falls_back_to_llm
  kind: tasks
  email: |
    Add: clean the main bathroom every Saturday, household.
  today: "2026-05-17"
  # Existing chore has NO object/qualifier (simulates a row created before
  # migration 005). Code path must fall back to the LLM dedup specialist.
  initial_chores:
    - id: clean-main-bathroom
      title: "Clean main bathroom"
      assignee: household
      recurrence_type: schedule
      recurrence_rule: { frequency: WEEKLY, interval: 1, byday: [SA] }
  expect:
    # The LLM should recognize the paraphrase and flag it.
    active_count_after: 1
    reply_contains: ["already"]

