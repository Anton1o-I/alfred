# Recurring-event scenarios. Recurring events skip the conflict check
# (they collide naturally over time) and emit an RRULE on the iCal.
#
# Each email pins an explicit start date so the test doesn't flap on
# Qwen's date-resolution variance — what we're testing here is that
# the recurrence rule gets set correctly, not date arithmetic.

- name: weekly_specific_day
  email: |
    Schedule a weekly standup starting May 18 at 9am for 15 minutes,
    repeating every Monday
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    event_summary_contains: ["standup"]
    has_recurrence: true
    calendar_count_after: 1

- name: bi_weekly
  email: |
    Add a 1:1 with my manager starting May 19 at 11am, every other Tuesday
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    event_summary_contains: ["1:1"]
    has_recurrence: true
    calendar_count_after: 1

- name: monthly
  email: |
    Block off May 19 at 10am for team retro, one hour, repeating monthly
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    event_summary_contains: ["retro"]
    has_recurrence: true

- name: weekly_multiple_days
  email: |
    Schedule yoga starting May 19 at 7am for 45 minutes, every Tuesday
    and Thursday
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    event_summary_contains: ["yoga"]
    has_recurrence: true

- name: recurring_skips_conflict_check
  email: |
    Add a weekly date night starting May 22 at 7pm, every Friday
  today: "2026-05-17"
  initial_calendar:
    - title: "Movie with kids"
      start: "2026-05-22T19:00:00-05:00"
      end:   "2026-05-22T20:00:00-05:00"
  expect:
    outcome: created
    has_recurrence: true
    # No Heads-up section even though Friday 7pm overlaps an existing event,
    # because recurring events skip the conflict check.
    reply_excludes: ["Heads up"]

# ── One-off events that mention frequency words (negative cases) ───────────

- name: not_recurring_one_word_off
  email: |
    Add lunch with Sarah on May 20 at 12:30pm
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    has_recurrence: false

- name: not_recurring_says_once
  email: |
    Schedule a one-time strategy meeting on May 19 at 2pm
  today: "2026-05-17"
  initial_calendar: []
  expect:
    outcome: created
    has_recurrence: false
