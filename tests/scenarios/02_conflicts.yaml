# Conflict scenarios. Conflicts no longer block creation — they show up
# as a "Heads up" callout in the reply, and the event is still written.

- name: conflict_still_creates_with_heads_up
  email: |
    Schedule a quick call with Mike on Monday May 25 at 12:30pm for 30 minutes
  today: "2026-05-17"
  initial_calendar:
    - title: "Lunch with Emily"
      start: "2026-05-25T12:30:00-05:00"
      end:   "2026-05-25T13:30:00-05:00"
  expect:
    outcome: created
    calendar_count_after: 2
    reply_contains: ["Heads up", "Lunch with Emily"]

- name: no_conflict_clean_create
  email: |
    Schedule a quick call with Mike on Monday May 25 at 3pm for 30 minutes
  today: "2026-05-17"
  initial_calendar:
    - title: "Lunch with Emily"
      start: "2026-05-25T12:30:00-05:00"
      end:   "2026-05-25T13:30:00-05:00"
  expect:
    outcome: created
    calendar_count_after: 2
    reply_excludes: ["Heads up"]
