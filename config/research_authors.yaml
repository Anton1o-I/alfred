# Author / lab signal for the curator's triage pass.
#
# Used to mitigate arXiv noise: items are matched against these lists by
# author name (exact, case-insensitive) and by lab/institution name
# (substring match against the abstract). Matches are passed into the
# triage prompt as a positive signal — NOT a hard filter. Items from
# unknown affiliations can still surface if the model judges the content
# exceptionally relevant.
#
# Coverage philosophy: this is not "the list of everyone who matters" —
# it's "labs and people whose name on a paper raises the prior that the
# work is substantive." Add or remove freely.

