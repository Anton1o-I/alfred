# Google Calendar configuration
#
# Setup steps:
#   1. Run: alfred google-auth
#   2. Share your wife's calendar with your Google account (read+write)
#   3. Run: alfred list-calendars
#   4. Copy the calendar IDs below

# Family members and their calendar IDs.
# "primary" = the authenticated account's main calendar.
# For shared calendars, use the full email address.
family:
  - name: ""         # Your name
    calendar_id: "primary"
  # - name: ""       # Wife's name
  #   calendar_id: "" # Her Google Calendar email

# Default timezone for new events (IANA timezone)
# See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: "America/Chicago"
