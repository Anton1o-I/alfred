# Calendar configuration
#
# "icloud" uses CalDAV + app-specific password (no OAuth, no expiration).
# "google" uses the Gmail OAuth token (subject to 7-day Testing-mode timer).
provider: "icloud"

# iCloud-only: which named calendar within the Apple ID to write to.
# Empty → principal default calendar. Use `alfred list-calendars` to inspect.
icloud_calendar_name: "Alfred"

# Default timezone for new events (IANA).
timezone: "America/Chicago"

# Google-only: legacy field, ignored when provider == "icloud".
calendar_id: "primary"

# Family members. Currently informational only — single-calendar setup.
family: []
