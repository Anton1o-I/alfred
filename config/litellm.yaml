model_list:
  # ── Local models (Ollama on homelab) ──────────────────────
  # Qwen 3 14B with thinking disabled. The `think: false` param disables
  # Qwen 3's <think> blocks at the Ollama API level — those blocks break
  # Pydantic AI's typed-output tool-call parsing. Disabling at the server
  # gets non-thinking output uniformly, regardless of how Pydantic AI
  # frames the call (tools, JSON mode, etc.).
  - model_name: local-default
    litellm_params:
      model: ollama/qwen3:14b
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 120
      max_tokens: 4096
      temperature: 0.2
      num_ctx: 8192
      think: false
      drop_params: false   # don't strip `think` — Ollama recognizes it even though OpenAI doesn't

  - model_name: local-fast
    litellm_params:
      model: ollama/qwen3:14b
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 60
      max_tokens: 2048
      temperature: 0.2
      num_ctx: 8192
      think: false
      drop_params: false

  # ── Cloud models (Anthropic) ──────────────────────────────
  - model_name: cloud-default
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 120
      max_tokens: 8192

  - model_name: cloud-strong
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 180
      max_tokens: 8192

# ── Router settings ──────────────────────────────────────────
router_settings:
  routing_strategy: "simple-shuffle"  # or "least-busy", "latency-based-routing"
  num_retries: 2
  timeout: 120
  retry_after: 5
  allowed_fails: 2

  # NO automatic fallback from local to cloud. Cloud (Anthropic) is opt-in
  # only — a request must explicitly target `cloud-default` or `cloud-strong`
  # to spend money. If local fails, the request fails loudly so the agent
  # (or the user) can decide whether to escalate.
  fallbacks: []

# ── General settings ─────────────────────────────────────────
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true   # silently drop unsupported params per provider
  set_verbose: false
  success_callback: ["otel"]
  failure_callback: ["otel"]

environment_variables:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://phoenix:4317"
  OTEL_SERVICE_NAME: "alfred-litellm"
