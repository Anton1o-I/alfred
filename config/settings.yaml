database_path: "data/alfred.db"
log_level: "INFO"

# LiteLLM Proxy handles all model routing, fallback, and cost tracking.
# Model definitions live in config/litellm.yaml, not here.
litellm:
  base_url: "http://localhost:4000"
  api_key_env: "LITELLM_MASTER_KEY"

budget:
  # Token caps are tracked for visibility (`alfred budget`) but NOT enforced
  # by default — local Ollama is free, so token quotas there are just friction.
  # Set any of these to a positive integer to re-enable enforcement.
  per_request_max_tokens: 8192
  global_daily_limit: 0
  global_monthly_limit: 0
  daily_agent_limits: {}

  # Dollar caps (USD) — the real safety net. 0 = unlimited. Local Ollama
  # calls cost $0, so these effectively only constrain cloud (Claude) spend.
  global_daily_usd_limit: 5.0
  global_monthly_usd_limit: 100.0
  daily_agent_usd_limits:
    calendar: 1.0
    meals: 1.0
    research: 2.0
    news: 1.0
    podcast: 1.0
    tasks: 0.5
    curator: 2.0

inbox:
  enabled: true
  # Allowlist comes from env vars to keep personal addresses out of tracked files.
  # Set ALFRED_ALLOWED_SENDER_1 and ALFRED_ALLOWED_SENDER_2 in .env.
  authorized_senders:
    - "${ALFRED_ALLOWED_SENDER_1}"
    - "${ALFRED_ALLOWED_SENDER_2}"

# NOTE: APScheduler's CronTrigger.from_crontab does NOT use Unix-cron
# day-of-week semantics. Numeric dow is 0=Mon..6=Sun (NOT 0=Sun). Always
# use named days (mon, tue, wed, thu, fri, sat, sun) for the dow field
# to keep this readable and bug-free.
scheduled_tasks:
  - name: "inbox_poll"
    cron: "* * * * *"  # Every minute — keeps perceived latency under ~30s
    agent_name: "inbox"
    message: "Poll inbox for inbound emails"
    enabled: true

  - name: "daily_briefing"
    cron: "0 7 * * *"  # Every day at 7:00 AM
    agent_name: "briefing"
    message: "daily"
    enabled: true

  - name: "weekly_preview"
    cron: "0 18 * * sun"  # Sunday 6:00 PM
    agent_name: "briefing"
    message: "weekly"
    enabled: true


  - name: "weekly_calendar_digest"
    cron: "0 18 * * sun"  # Sunday 6:00 PM
    agent_name: "calendar"
    message: "Generate the weekly calendar digest for this upcoming week"
    enabled: false

  - name: "daily_morning_briefing"
    cron: "0 7 * * *"  # Daily 7:00 AM
    agent_name: "calendar"
    message: "Generate today's schedule briefing"
    enabled: false

  - name: "daily_news_digest"
    cron: "0 7 * * *"  # Daily 7:00 AM
    agent_name: "news"
    message: "Generate today's news digest for all active topics"
    enabled: false

  - name: "weekly_research_curator"
    cron: "0 4 * * mon"  # Monday 4:00 AM — ready for the Monday morning read
    agent_name: "curator"
    message: "Generate the weekly research curator digest"
    enabled: true

  - name: "podcast_check"
    cron: "0 20 * * *"  # Daily 8:00 PM
    agent_name: "podcast"
    message: "Check for new podcast episodes and summarize any that match active topics"
    enabled: false
